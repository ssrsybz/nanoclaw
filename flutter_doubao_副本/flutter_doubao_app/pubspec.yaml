name: flutter_doubao_app
description: "A Flutter app with LLM interaction and communication features."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  provider: ^6.1.1
  http: ^1.2.1
  image_picker: ^1.1.2
  animated_text_kit: ^4.2.2
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  record: ^6.0.0
  audioplayers: ^6.1.0
  permission_handler: ^12.0.0
  path_provider: ^2.1.1
  uuid: ^4.5.1
  wakelock_plus: ^1.2.8
  volc_engine_rtc: ^3.58.1
  crypto: ^3.0.3
  video_player: ^2.8.1
  gal: ^2.3.0
  camera: ^0.11.0+2
  # 远程控制依赖
  web_socket_channel: ^3.0.1
  mobile_scanner: ^5.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/videos/
  shaders:
    - shaders/beauty.frag
